name: JMOD firmware and Marauder UI checks

on:
  pull_request:
  push:
    branches: [main, 'jmod/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Firmware tools
        run: python -m unittest discover -s tools
      - name: Native protocol and storage tests
        run: |
          python tools/run_protocol_tests.py
          python tests/host_connection/test_capture_storage.py
          python tests/host_connection/test_cli_registry.py
          python tests/host_connection/test_selection_service.py
      - name: Marauder UI Python tests
        working-directory: Marauder-UI
        run: python -m unittest discover -s tests
      - name: Marauder UI JavaScript tests
        working-directory: Marauder-UI
        run: |
          for test_file in tests/*.cjs; do
            node "$test_file"
          done
